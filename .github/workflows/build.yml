name: build-images

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly, to pick up a new Claude Code release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve names and versions
        id: meta
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: true
          build-args: CLAUDE_CODE_VERSION=${{ steps.meta.outputs.claude }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/sandbox:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/sandbox:claude-${{ steps.meta.outputs.claude }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repo }}/bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
