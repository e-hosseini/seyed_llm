# ANTHROPIC_OAUTH_TOKEN is a Claude subscription token (claude setup-token).
# LiteLLM sends sk-ant-oat* as Authorization: Bearer and adds the OAuth beta header.
# Every sandbox session bills that one account. An empty token falls back to ANTHROPIC_API_KEY.
#
# Enforced: every model name a sandbox can ask for (full names and the short aliases some
# Claude Code paths use) is routed to the one real backend model, claude-sonnet-5. Nothing
# in the sandboxes needs to change for this to take effect.
model_list:
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
  - model_name: claude-haiku-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
