services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm # the bot and the sandboxes address it by this name
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
    # No published ports: only the bot and the per-user sandbox networks can reach it.

  bot:
    image: ${BOT_IMAGE:-aggs-bot-unset}
    restart: unless-stopped
    env_file: .env
    environment:
      LITELLM_URL: http://litellm:4000
      DB_PATH: /data/aggs.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bot-data:/data
    depends_on:
      - litellm

volumes:
  postgres-data:
  bot-data:
